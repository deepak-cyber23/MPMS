# Netlify Configuration for Movers & Packers Management System (MPMS)

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/data/**"]

# API Proxy to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
